<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Órdenes · Admin | NovaStore</title>
  <link rel="icon" type="image/png" href="../../assets/img/marca/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/brand-overrides.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/tienda.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

  <script>
    window.RUTA_ASSETS_BASE = '../../assets/img/';
    window.RUTA_TIENDA_BASE = '../../pages/tienda/';
    window.RUTA_ADMIN_BASE = '../../pages/admin/';
  </script>

  <div class="layout-admin">
    <nav class="admin-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="menuAdmin"
      aria-label="Menú del administrador">
      <div class="offcanvas-header d-lg-none">
        <span class="fw-bold">Menú</span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
          data-bs-target="#menuAdmin" aria-label="Cerrar menú"></button>
      </div>

      <div class="offcanvas-body d-flex flex-column">
        <a href="home.html" class="d-block mb-4">
          <img src="../../assets/img/marca/logo-blanco.png" alt="NovaStore" style="height:44px;width:auto;">
        </a>

        <ul class="admin-sidebar__lista" data-menu-admin></ul>

        <div class="mt-auto pt-4">
          <p class="mb-2" data-usuario-admin></p>
          <a href="../../index.html" class="d-block small mb-2">Ver la tienda</a>
          <button type="button" class="btn btn-outline-light btn-sm w-100" data-salir>Cerrar sesión</button>
        </div>
      </div>
    </nav>

    <div class="admin-contenido">
      <button class="btn btn-dark d-lg-none mb-3" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#menuAdmin" aria-controls="menuAdmin">&#9776; Menú</button>

      <div class="admin-topbar">
        <div>
          <h1 class="h3 mb-1">Órdenes de compra</h1>
          <p class="mb-0 small">Pedidos generados desde el carrito de la tienda.</p>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-12 col-md-6 col-lg-4">
          <label class="form-label fw-semibold" for="filtroEstado">Estado</label>
          <select id="filtroEstado" class="form-select">
            <option value="todos">Todos</option>
            <option value="pendiente">Pendiente</option>
            <option value="preparando">Preparando</option>
            <option value="enviada">Enviada</option>
            <option value="entregada">Entregada</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle bg-white">
          <thead>
            <tr>
              <th scope="col">N° orden</th>
              <th scope="col">Fecha</th>
              <th scope="col">Cliente</th>
              <th scope="col">Productos</th>
              <th scope="col">Total</th>
              <th scope="col">Estado</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody data-tabla-ordenes></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/data/productos.js"></script>
  <script src="../../js/data/regiones.js"></script>
  <script src="../../js/data/blogs.js"></script>
  <script src="../../js/utils/storage.js"></script>
  <script src="../../js/utils/validaciones.js"></script>
  <script src="../../js/utils/auth.js"></script>
  <script src="../../js/utils/carrito.js"></script>
  <script src="../../js/utils/ordenes.js"></script>
  <script src="../../js/components/render-productos.js"></script>
  <script src="../../js/components/admin-menu.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      inicializarProductos();
      inicializarUsuarios();
      Auth.protegerVistaAdmin();
      pintarMenuAdmin('ordenes');
      aplicarPermisosEscritura();
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const filtro = document.getElementById('filtroEstado');

      function pintarOrdenes() {
        const ordenes = obtenerOrdenes().filter((orden) =>
          filtro.value === 'todos' || orden.estado === filtro.value);

        document.querySelector('[data-tabla-ordenes]').innerHTML = ordenes.length
          ? ordenes.map((orden) => `
              <tr>
                <td>${orden.id}</td>
                <td class="small">${formatearFecha(orden.fecha)}</td>
                <td>${orden.clienteNombre}<br><span class="small">${orden.clienteCorreo}</span></td>
                <td>${orden.items.reduce((suma, item) => suma + item.cantidad, 0)}</td>
                <td>${formatearCLP(orden.total)}</td>
                <td><span class="badge text-bg-light text-capitalize">${orden.estado}</span></td>
                <td>
                  <div class="admin-acciones-tabla">
                    <a href="orden-detalle.html?id=${orden.id}" class="btn btn-outline-secondary">Ver detalle</a>
                  </div>
                </td>
              </tr>`).join('')
          : '<tr><td colspan="7" class="text-center py-4">Todavía no hay órdenes registradas.</td></tr>';
      }

      filtro.addEventListener('change', pintarOrdenes);
      pintarOrdenes();
    });
  </script>

</body>
</html>
