<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de orden · Admin | NovaStore</title>
  <link rel="icon" type="image/png" href="../../assets/img/marca/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/brand-overrides.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/tienda.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

  <script>
    window.RUTA_ASSETS_BASE = '../../assets/img/';
    window.RUTA_TIENDA_BASE = '../../pages/tienda/';
    window.RUTA_ADMIN_BASE = '../../pages/admin/';
  </script>

  <div class="layout-admin">
    <nav class="admin-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="menuAdmin"
      aria-label="Menú del administrador">
      <div class="offcanvas-header d-lg-none">
        <span class="fw-bold">Menú</span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
          data-bs-target="#menuAdmin" aria-label="Cerrar menú"></button>
      </div>

      <div class="offcanvas-body d-flex flex-column">
        <a href="home.html" class="d-block mb-4">
          <img src="../../assets/img/marca/logo-blanco.png" alt="NovaStore" style="height:44px;width:auto;">
        </a>

        <ul class="admin-sidebar__lista" data-menu-admin></ul>

        <div class="mt-auto pt-4">
          <p class="mb-2" data-usuario-admin></p>
          <a href="../../index.html" class="d-block small mb-2">Ver la tienda</a>
          <button type="button" class="btn btn-outline-light btn-sm w-100" data-salir>Cerrar sesión</button>
        </div>
      </div>
    </nav>

    <div class="admin-contenido">
      <button class="btn btn-dark d-lg-none mb-3" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#menuAdmin" aria-controls="menuAdmin">&#9776; Menú</button>

      <div class="admin-topbar">
        <div>
          <h1 class="h3 mb-1">Detalle de la orden</h1>
          <p class="mb-0 small" data-subtitulo></p>
        </div>
        <a href="ordenes.html" class="btn btn-outline-primary">Volver a órdenes</a>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body" data-detalle-orden></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/data/productos.js"></script>
  <script src="../../js/data/regiones.js"></script>
  <script src="../../js/data/blogs.js"></script>
  <script src="../../js/utils/storage.js"></script>
  <script src="../../js/utils/validaciones.js"></script>
  <script src="../../js/utils/auth.js"></script>
  <script src="../../js/utils/carrito.js"></script>
  <script src="../../js/utils/ordenes.js"></script>
  <script src="../../js/components/render-productos.js"></script>
  <script src="../../js/components/admin-menu.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      inicializarProductos();
      inicializarUsuarios();
      Auth.protegerVistaAdmin();
      pintarMenuAdmin('ordenes');
      aplicarPermisosEscritura();
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const id = new URLSearchParams(window.location.search).get('id');
      const contenedor = document.querySelector('[data-detalle-orden]');

      function pintar() {
        const orden = obtenerOrdenPorId(id);
        if (!orden) {
          contenedor.innerHTML = '<p class="mb-0">No encontramos esa orden.</p>';
          return;
        }

        document.querySelector('[data-subtitulo]').textContent =
          orden.id + ' · ' + formatearFecha(orden.fecha);

        contenedor.innerHTML = `
          <div class="row g-4 mb-4">
            <div class="col-12 col-md-6">
              <h2 class="h6">Cliente</h2>
              <p class="mb-0">${orden.clienteNombre}</p>
              <p class="mb-0 small">${orden.clienteCorreo || 'Sin correo'}</p>
              <p class="mb-0 small">RUN: ${orden.clienteRun || '—'}</p>
            </div>
            <div class="col-12 col-md-6">
              <h2 class="h6">Estado</h2>
              <div class="d-flex flex-wrap gap-2 align-items-center">
                <select class="form-select w-auto" data-estado>
                  ${ESTADOS_ORDEN.map((estado) => `
                    <option value="${estado}" ${estado === orden.estado ? 'selected' : ''}>
                      ${estado.charAt(0).toUpperCase() + estado.slice(1)}
                    </option>`).join('')}
                </select>
                <button type="button" class="btn btn-primary" data-guardar-estado>Actualizar</button>
              </div>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th scope="col">Producto</th>
                  <th scope="col">Precio</th>
                  <th scope="col">Cantidad</th>
                  <th scope="col">Subtotal</th>
                </tr>
              </thead>
              <tbody>
                ${orden.items.map((item) => `
                  <tr>
                    <td>
                      <span class="d-flex align-items-center gap-2">
                        <img src="../../assets/img/${item.imagen}" alt="" class="admin-miniatura">
                        ${item.nombre}
                      </span>
                    </td>
                    <td>${formatearCLP(item.precio)}</td>
                    <td>${item.cantidad}</td>
                    <td>${formatearCLP(item.precio * item.cantidad)}</td>
                  </tr>`).join('')}
              </tbody>
              <tfoot>
                <tr>
                  <th colspan="3" class="text-end">Total</th>
                  <th>${formatearCLP(orden.total)}</th>
                </tr>
              </tfoot>
            </table>
          </div>
        `;

        contenedor.querySelector('[data-guardar-estado]').addEventListener('click', () => {
          cambiarEstadoOrden(orden.id, contenedor.querySelector('[data-estado]').value);
          pintar();
        });
      }

      pintar();
    });
  </script>

</body>
</html>
