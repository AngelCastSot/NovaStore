<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de producto · Admin | NovaStore</title>
  <link rel="icon" type="image/png" href="../../assets/img/marca/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/brand-overrides.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/tienda.css">
  <link rel="stylesheet" href="../../css/admin.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

  <script>
    window.RUTA_ASSETS_BASE = '../../assets/img/';
    window.RUTA_TIENDA_BASE = '../../pages/tienda/';
    window.RUTA_ADMIN_BASE = '../../pages/admin/';
  </script>

  <div class="layout-admin">
    <nav class="admin-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="menuAdmin"
      aria-label="Menú del administrador">
      <div class="offcanvas-header d-lg-none">
        <span class="fw-bold">Menú</span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
          data-bs-target="#menuAdmin" aria-label="Cerrar menú"></button>
      </div>

      <div class="offcanvas-body d-flex flex-column">
        <a href="home.html" class="d-block mb-4">
          <img src="../../assets/img/marca/logo-blanco.png" alt="NovaStore" style="height:44px;width:auto;">
        </a>

        <ul class="admin-sidebar__lista" data-menu-admin></ul>

        <div class="mt-auto pt-4">
          <p class="mb-2" data-usuario-admin></p>
          <a href="../../index.html" class="d-block small mb-2">Ver la tienda</a>
          <button type="button" class="btn btn-outline-light btn-sm w-100" data-salir>Cerrar sesión</button>
        </div>
      </div>
    </nav>

    <div class="admin-contenido">
      <button class="btn btn-dark d-lg-none mb-3" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#menuAdmin" aria-controls="menuAdmin">&#9776; Menú</button>

      <div class="admin-topbar">
        <div>
          <h1 class="h3 mb-1">Detalle del producto</h1>
          <p class="mb-0 small">Vista de solo lectura.</p>
        </div>
        <a href="productos.html" class="btn btn-outline-primary">Volver al listado</a>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body" data-detalle-producto></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/data/productos.js"></script>
  <script src="../../js/data/regiones.js"></script>
  <script src="../../js/data/blogs.js"></script>
  <script src="../../js/utils/storage.js"></script>
  <script src="../../js/utils/validaciones.js"></script>
  <script src="../../js/utils/auth.js"></script>
  <script src="../../js/utils/carrito.js"></script>
  <script src="../../js/utils/ordenes.js"></script>
  <script src="../../js/components/render-productos.js"></script>
  <script src="../../js/components/admin-menu.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      inicializarProductos();
      inicializarUsuarios();
      Auth.protegerVistaAdmin();
      pintarMenuAdmin('productos');
      aplicarPermisosEscritura();
    });
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const id = new URLSearchParams(window.location.search).get('id');
      const producto = Storage.obtener(STORAGE_KEYS.PRODUCTOS, PRODUCTOS).find((item) => item.id === id);
      const contenedor = document.querySelector('[data-detalle-producto]');

      if (!producto) {
        contenedor.innerHTML = '<p class="mb-0">No encontramos ese producto.</p>';
        return;
      }

      const categoria = CATEGORIAS.find((cat) => cat.id === producto.categoria);
      const critico = Number(producto.stock) <= Number(producto.stockCritico || 0);

      contenedor.innerHTML = `
        <div class="row g-4">
          <div class="col-12 col-md-5">
            <img src="../../assets/img/${producto.imagen}" alt="${producto.nombre}"
              class="w-100 rounded border">
          </div>
          <div class="col-12 col-md-7">
            <p class="text-marca fw-semibold small mb-1">${producto.codigo}</p>
            <h2 class="h4">${producto.nombre}</h2>
            <p>${producto.descripcion || 'Sin descripción.'}</p>
            <dl class="row mb-0">
              <dt class="col-5 col-sm-4">Categoría</dt>
              <dd class="col-7 col-sm-8">${categoria ? categoria.nombre : producto.categoria}</dd>
              <dt class="col-5 col-sm-4">Precio</dt>
              <dd class="col-7 col-sm-8">${formatearCLP(producto.precio)}</dd>
              <dt class="col-5 col-sm-4">Stock</dt>
              <dd class="col-7 col-sm-8">
                ${producto.stock} ${critico ? '<span class="badge text-bg-warning">Reponer</span>' : ''}
              </dd>
              <dt class="col-5 col-sm-4">Stock crítico</dt>
              <dd class="col-7 col-sm-8">${producto.stockCritico ?? 'No definido'}</dd>
            </dl>
            <div class="mt-4" data-solo-admin>
              <a href="producto-form.html?id=${producto.id}" class="btn btn-primary">Editar producto</a>
            </div>
          </div>
        </div>
      `;

      aplicarPermisosEscritura();
    });
  </script>

</body>
</html>
